# Phase 16 step 4 — inference serving Deployment.
# Status: real, complete, UNRUN (no kubectl/cluster locally — see
# containers/README.md). Targets Kubernetes 1.30 API conventions
# (apps/v1 Deployment, stable since 1.9).
#
# UPDATE (2026-07-30): the gap this manifest previously disclosed — no
# long-running serving process, only `serving_router_test` (a unit test
# that asserts and exits) — is now closed. See
# `inference_serving/serving_backend/README.md`'s "serving_daemon" section
# for the real binary, its real local run (client round-trip over a real
# TCP socket, clean SIGTERM shutdown, a real crash bug found and fixed
# during testing). This manifest is still cluster-unrun (no real
# Kubernetes cluster on this Mac), but now targets a real, tested
# entrypoint instead of an aspirational one.
#
# `serving_daemon`'s actual wire protocol is a deliberately minimal raw
# TCP line protocol (one line of text in, one line of generated text
# back) — NOT HTTP, so this manifest uses `tcpSocket` probes rather than
# `httpGet` ones (there is no `/healthz` HTTP endpoint to poll). Port and
# generation length are configured via the env vars `serving_daemon.cpp`
# actually reads (`SERVING_PORT`, `SERVING_MAX_NEW_TOKENS`), not CLI
# flags — the real binary takes no arguments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-router
  labels:
    app: serving-router
    component: inference-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: serving-router
  template:
    metadata:
      labels:
        app: serving-router
    spec:
      containers:
        - name: serving-router
          image: cross_machine_runtime:latest
          command: ["/src/build/debug/inference_serving/serving_backend/serving_daemon"]
          env:
            - name: SERVING_PORT
              value: "8080"
            - name: SERVING_MAX_NEW_TOKENS
              value: "20"
          ports:
            - containerPort: 8080
              name: serving-tcp
          # TCP-connect probes, not HTTP: serving_daemon's real protocol
          # has no HTTP layer. A future SLA-aware readiness signal (per
          # inference_serving/sla_scheduler's EDF admission, Phase 9 step
          # 3 — a pod that's technically up but badly missing its
          # latency budget should stop receiving new traffic) would need
          # serving_daemon to expose that itself; not built as part of
          # this pass, kept as a real, disclosed gap rather than a fake
          # httpGet probe against an endpoint that doesn't exist.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
