# Phase 16 step 5 — gang-scheduled manifest for distributed training.
# Status: real, complete, UNRUN (no cluster locally — see
# containers/README.md).
#
# Judgment call, stated explicitly per this step's own instructions: a
# plain `StatefulSet` with `podManagementPolicy: Parallel` was chosen over
# a Kubeflow `PyTorchJob`. Reasoning: `PyTorchJob` is a CRD installed by
# the Kubeflow training-operator, which is a real, separate cluster
# dependency this repo cannot assume exists (unlike `Deployment`/
# `StatefulSet`, built into every Kubernetes distribution) — and this
# repo's training loop is NOT a PyTorch program (`distributed_training/`
# is a from-scratch autograd + collectives stack, see
# `distributed_training/autograd/`), so `PyTorchJob`'s specific value-add
# (torch.distributed environment-variable injection, torchrun-aware
# restart semantics) doesn't actually apply here. A generic multi-pod
# gang-start primitive is the honest fit; if a training-operator-style CRD
# is ever installed for other reasons, this StatefulSet's shape ports
# directly (same replica/env-var/DNS pattern most training operators use
# under the hood).
#
# Why synchronized start matters, concretely, for THIS workload:
# `podManagementPolicy` defaults to `OrderedReady`, which starts pod N+1
# only once pod N reports Ready — fine for a stateful app like a
# database replica set, but wrong for a rank-based collective: every
# rank in a ring all-reduce (`networking/ring_allreduce`,
# `distributed_training/full_training_loop` step 20) needs to open a
# connection to its ring neighbor(s) during its OWN startup rendezvous;
# if rank 3 comes up while rank 0 is still `OrderedReady`-pending behind
# ranks 1-2, rank 3's very first connect-to-neighbor attempt targets a
# pod that doesn't exist yet. `Parallel` schedules all N pods
# simultaneously so every rank's rendezvous retry loop
# (`connectWithRetry` in `networking/common/channel.cpp`) has real peers
# to eventually connect to, instead of racing the default one-at-a-time
# rollout.
#
# UPDATE (2026-07-30): the gap this manifest previously disclosed —
# no binary in this repo took a rank ID and peer addresses from the
# environment and behaved as ONE rank in a real multi-process topology,
# only thread-simulated ranks inside one process (ring_allreduce,
# collectives, full_training_loop) — is now closed. See
# `distributed_training/training_worker/README.md` for the real binary,
# its real 4-separate-OS-process local test run (loss trajectory
# matches the thread-simulated baseline exactly: 2.6317 -> 0.0008 both
# ways), and the new `networking/common::TcpChannel` peer_hosts
# constructor it depends on. This manifest is still cluster-unrun (no
# real Kubernetes cluster on this Mac), but now targets a real, tested
# entrypoint instead of an aspirational one.
#
# RANK derivation: Kubernetes' downward API has no direct "pod ordinal"
# field, only the full pod name (training-worker-0, -1, ...) — the
# command below parses the integer suffix after the last '-' itself,
# same as the gap note originally specified. PEER_HOSTS is built from
# the predictable per-pod DNS pattern the headless Service
# (`headless-service.yaml`) provides: `<name>-<ordinal>.<subdomain>`.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: training-worker
spec:
  serviceName: training-worker
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: training-worker
  template:
    metadata:
      labels:
        app: training-worker
    spec:
      subdomain: training-worker
      containers:
        - name: training-worker
          image: cross_machine_runtime:latest
          # Real training_worker binary (distributed_training/training_worker/) —
          # locally built and run as 4 separate OS processes, see its
          # README. RANK is derived from the pod's ordinal (parsed from
          # POD_NAME) since Kubernetes doesn't inject it directly;
          # PEER_HOSTS is built from WORLD_SIZE and the headless
          # Service's predictable per-ordinal DNS names.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ORDINAL="${POD_NAME##*-}"
              export RANK="$ORDINAL"
              PEERS=""
              for i in $(seq 0 $((WORLD_SIZE - 1))); do
                PEERS="${PEERS:+$PEERS,}training-worker-${i}.training-worker"
              done
              export PEER_HOSTS="$PEERS"
              export BASE_PORT="$MASTER_PORT"
              export CHECKPOINT_DIR="/checkpoints"
              exec /src/build/debug/distributed_training/training_worker/training_worker
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORLD_SIZE
              value: "4"
            - name: MASTER_ADDR
              value: "training-worker-0.training-worker"
            - name: MASTER_PORT
              value: "29500"
            - name: EPOCHS
              value: "30"
          ports:
            # Nominal only: every pod in a StatefulSet shares this same
            # pod template, but training_worker actually listens on
            # BASE_PORT+RANK (29500+ordinal), which differs per pod --
            # Kubernetes has no per-replica containerPort mechanism, and
            # containerPort itself is documentation only (not enforced),
            # so this doesn't block real traffic on the true port.
            - containerPort: 29500
              name: rendezvous
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
