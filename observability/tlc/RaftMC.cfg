\* TLC model config for RaftMC.tla (see that file for why this exists as
\* a separate MC module rather than a Raft.tla edit).
\*
\* Server/Value/Nil below are undeclared symbols -- TLC treats them as
\* distinct "model values" automatically, the standard TLA+ idiom for
\* finite instantiation of a spec's CONSTANTS.

CONSTANTS
    Server = {s1, s2, s3}
    Value = {v1, v2}
    Nil = Nil

SPECIFICATION Spec

CONSTRAINT StateConstraint

INVARIANTS
    OneLeaderPerTerm
    LogMatching
    CommittedEntriesAgree

\* CHECK_DEADLOCK left at TLC's default (TRUE): unlike Collective.tla,
\* Raft has no legitimate "nothing left to do" terminal state -- a Leader
\* can always SendAppendEntries, a Follower/Candidate can always Timeout
\* -- so TLC reporting a deadlock here would mean a real spec bug, not a
\* false positive to suppress.
