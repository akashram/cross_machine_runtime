\* TLC model config for networking/tla_collective/Collective.tla.
\* N (ring size) = 3: small enough for exhaustive TLC exploration,
\* large enough that Right(r) != Left(r) for every rank (the N=2 case
\* collapses both neighbors onto the same channel -- still a valid, even
\* more constrained case worth checking separately, see README.md).

CONSTANTS
    N = 3

SPECIFICATION Spec

INVARIANTS
    AllRanksAgree

\* CHECK_DEADLOCK FALSE: AllFinished (every rank has completed all
\* 2*(N-1) rounds) is a legitimate terminal state -- Next has nothing
\* left enabled once every rank is Finished, which is correct
\* termination, not a bug. Without this, TLC would report every run's own
\* successful completion as a deadlock.
CHECK_DEADLOCK FALSE
