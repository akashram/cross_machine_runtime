# gres.conf -- GPU generic-resource definitions for the gpu-training
# partition (slurm.conf's `gpu-node[01-04]` nodes, `Gres=gpu:a100:8`).
#
# AutoDetect=nvml is real, documented SchedMD syntax: slurmd calls NVML
# directly on each GPU node to enumerate real devices/topology rather
# than needing a hand-maintained per-node File= line for every card --
# the SAME library gpu_engine/power/power_monitor.h already wraps for
# this repo's own GPU power telemetry (nvmlDeviceGetPowerUsage etc.),
# reused here for device enumeration instead of power. Both uses stay
# hardware-gated identically (no GPU on this Mac) -- this file doesn't
# change that gap.

AutoDetect=nvml
Name=gpu Type=a100 File=/dev/nvidia[0-7]
