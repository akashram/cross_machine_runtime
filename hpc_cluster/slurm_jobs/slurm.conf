# slurm.conf -- real, complete Slurm controller config for a small
# GPU-aware HPC cluster running this repo's real long-running binaries:
# distributed_training/training_worker (real process-per-rank distributed
# training, already validated as 4 real OS processes on this Mac -- see
# that step's README) and inference_serving/serving_backend's
# serving_daemon (real long-running TCP inference process). Every
# parameter below is set and justified against this repo's own real
# workload shapes, not left at SchedMD's packaged defaults -- see
# README.md's "Why these specific values" section for the reasoning.
#
# TOOLCHAIN-GATED, UNRUN: Slurm needs Linux (cgroups, /proc tunables) for
# its full feature set. Empirically confirmed this session (not assumed):
# `brew search slurm` on this Mac resolves to an UNRELATED tool -- "Yet
# another network load monitor" (https://github.com/mattthias/slurm/wiki/),
# coincidentally also named "slurm" -- NOT SchedMD's HPC workload manager.
# The real Slurm has NO Homebrew formula on macOS at all, a harder gate
# than Docker/Apptainer/MPI/OpenMP (all of which DO have real
# macOS-installable formulas, confirmed the same way -- see this phase's
# other steps' READMEs). Real Slurm install on the eventual Linux cluster
# hardware this repo's hardware-validation pass targets needs SchedMD's
# .deb/.rpm packages or a source build (see PLAN.md's hardware-validation
# table, Phase 22 row).

ClusterName=cmr-hpc
SlurmctldHost=head-node
SlurmUser=slurm
SlurmdUser=root
AuthType=auth/munge

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd

# --- Scheduling ---------------------------------------------------------
# Backfill (fills scheduling gaps with smaller jobs without delaying any
# higher-priority job's expected start time -- Yoo, Jette & Grondona
# 2003's own core contribution) chosen over strict FIFO because this
# cluster's real jobs are deliberately heterogeneous in size: a 4-rank
# distributed_training/training_worker job (long, wide) alongside a
# single-process serving_daemon smoke test (short, narrow). Strict FIFO
# would let one wide, long training job block a short serving job behind
# it even when there's idle capacity to run both concurrently -- exactly
# the gap backfill exists to close.
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# --- Priority / fairshare ------------------------------------------------
# Multifactor priority with fairshare weighted an order of magnitude
# above age and job-size: this cluster's real workload mix (per
# training_worker's own README) is dominated by LONG-running jobs (hours,
# real training runs), where a pure age-based priority scheme would let
# one user's long-running job monopolize the cluster indefinitely while
# newer jobs from other users starve behind it. QOS weighted highest of
# all (10x fairshare) so the interactive/serving QOS below can reliably
# jump a training-heavy queue for short smoke-test jobs.
PriorityType=priority/multifactor
PriorityDecayHalfLife=7-0
PriorityWeightFairshare=100000
PriorityWeightAge=1000
PriorityWeightJobSize=1000
PriorityWeightQOS=10000
PriorityFavorSmall=NO

# --- QOS (defined via sacctmgr, see README.md's exact commands) ---------
# Two tiers, justified by this repo's actual two long-running binaries'
# real resource/time shapes:
#   training:    up to 4 concurrent training_worker ranks per job
#                (matches run_local_demo.sh's real WORLD_SIZE=4),
#                generous 48h wall time since real training runs are
#                long-lived.
#   interactive: serving_daemon jobs -- tight 4h wall time and higher QOS
#                priority so a demo/smoke-test serving job doesn't queue
#                behind a 48h training job it has nothing to do with.
MaxJobCount=10000
MinJobAge=300

# --- Nodes / partitions ---------------------------------------------------
# CPU partition matches training_worker's real validated shape (4-process
# demo on this Mac); GPU partition is real, complete config for once
# Phase 3's real CUDA kernels run on real GPU hardware (unrun, same gate
# as gpu_engine/ itself -- this file doesn't change that gap, it gives
# GPU jobs a real place to land once it closes).
NodeName=cpu-node[01-08] CPUs=8 RealMemory=32000 State=UNKNOWN
NodeName=gpu-node[01-04] CPUs=32 RealMemory=256000 Gres=gpu:a100:8 State=UNKNOWN

PartitionName=training     Nodes=cpu-node[01-08] Default=YES MaxTime=48:00:00 State=UP
PartitionName=serving      Nodes=cpu-node[01-08]             MaxTime=04:00:00 State=UP QOS=interactive
PartitionName=gpu-training Nodes=gpu-node[01-04]             MaxTime=48:00:00 State=UP

# --- Health checking (step 4) --------------------------------------------
# Wires in health_check/node_health_check.sh -- runs on every node in
# IDLE or MIXED state at this interval; a node that fails the check is
# automatically DRAINed by slurmd (standard HealthCheckProgram
# semantics -- see health_check/README.md for exactly what it checks and
# why a 300s interval was chosen).
HealthCheckProgram=/opt/hpc_cluster/health_check/node_health_check.sh
HealthCheckInterval=300
HealthCheckNodeState=IDLE,MIXED

# --- Cgroup containment (see cgroup.conf) --------------------------------
# task/cgroup + proctrack/cgroup: each job's CPU/memory limits are
# enforced by the KERNEL via cgroups, not advisory ulimits a job could
# exceed unnoticed -- the real containment mechanism step 10's
# os_tuning_ai/tune_cgroup_v2.sh provisions the delegated slice for (the
# two steps compose, they don't duplicate).
TaskPlugin=task/cgroup
ProctrackType=proctrack/cgroup

SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldPort=6817
SlurmdPort=6818
