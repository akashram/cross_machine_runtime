# cgroup.conf -- Slurm's cgroup-based task/job containment, referenced by
# slurm.conf's TaskPlugin=task/cgroup / ProctrackType=proctrack/cgroup.
#
# The cgroup v2 controllers this needs (memory, cpuset, pids) are the
# SAME kernel mechanism step 10's os_tuning_ai/tune_cgroup_v2.sh
# provisions a delegated slice for -- these two steps are designed to
# compose (Slurm's own per-job cgroup containment sits inside the cgroup
# v2 hierarchy that step sets up for the AI-workload host in general),
# not duplicate each other.

CgroupPlugin=cgroup/v2

# Hard-enforce core and RAM limits per job -- a job that requests
# --cpus-per-task=4 physically cannot use a 5th core, and a job that
# exceeds its requested memory is OOM-killed by the kernel cgroup
# controller rather than silently swapping (which would degrade every
# OTHER job co-located on the same node, exactly the noisy-neighbor
# problem cgroup containment exists to prevent).
ConstrainCores=yes
ConstrainRAMSpace=yes
ConstrainDevices=yes
ConstrainSwapSpace=yes

# 100%: a job's cgroup memory ceiling is exactly its requested
# --mem, no slack. 0% swap: real training/serving workloads (this
# repo's own two long-running binaries) degrade unpredictably under
# swapping far more than they benefit from a soft overcommit margin --
# same reasoning step 10's tune_memory.sh documents for
# vm.swappiness on the host as a whole.
AllowedRAMSpace=100
AllowedSwapSpace=0
